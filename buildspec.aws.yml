version: 0.2

phases:
  pre_build:
    commands:
      - IMAGE_TAG="$(printf '%.12s' "$CODEBUILD_RESOLVED_SOURCE_VERSION")"
      - REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
  build:
    commands:
      - docker build --platform linux/amd64 -t "$REGISTRY/$AWS_ECR_REPOSITORY:$IMAGE_TAG" .
  post_build:
    commands:
      - docker push "$REGISTRY/$AWS_ECR_REPOSITORY:$IMAGE_TAG"
