services:
  - type: web
    name: reproductor-estructuras-datos
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECRET
        generateValue: true
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: reproductor-estructuras-datos-db
          property: connectionString
      - key: MAX_PLAYLISTS_PER_OWNER
        value: '50'
      - key: MAX_TRACKS_PER_PLAYLIST
        value: '500'
      - key: BODY_LIMIT_BYTES
        value: '16384'
      - key: RATE_LIMIT_MAX
        value: '120'

databases:
  - name: reproductor-estructuras-datos-db
    plan: free
    databaseName: reproductor
    user: reproductor
